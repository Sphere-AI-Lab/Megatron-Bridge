# Example YAML configuration for Llama 3.2 1B finetuning with OFT
# OFT (Orthogonal Fine-Tuning) learns block-diagonal orthogonal rotations
# applied to the input of linear layers, preserving angular structure of
# the pretrained weight space.

# Data configuration
dataset:
  seq_length: 4096

# Training configuration
train:
  train_iters: 100
  global_batch_size: 128
  micro_batch_size: 2
  eval_iters: 10
  eval_interval: 50

# Optimizer configuration
optimizer:
  lr: 0.0001
  min_lr: 0.00001
  weight_decay: 0.0

# Learning rate scheduler
scheduler:
  lr_warmup_iters: 10
  lr_decay_style: cosine

# Checkpoint configuration
checkpoint:
  save: ./checkpoints/llama32_1b_oft_finetuned
  load: ./checkpoints/llama32_1b_oft_finetuned
  pretrained_checkpoint: ./checkpoints/llama32_1b

  save_interval: 50

# OFT configuration
peft:
  block_size: 32        # Size of each orthogonal block (larger = more params)
  # r: 0                # Number of blocks (alternative to block_size, mutually exclusive)
  # coft: false         # Constrained OFT — projects rotations to epsilon-ball
  # eps: 0.00006        # Epsilon for COFT constraint
  # block_share: false  # Share parameters across all blocks
  # module_dropout: 0.0 # Multiplicative dropout probability for blocks

# Model configuration
model:
  seq_length: 4096
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  context_parallel_size: 1

# Logging
logger:
  log_interval: 10
  tensorboard_dir: ./logs/llama32_1b_oft_finetuned

# Random seed
rng:
  seed: 1234
